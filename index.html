<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Suscripción PROFIT® · Elegí tu producto y cada cuánto lo recibís</title>
  <meta name="description" content="Suscripción PROFIT®: elegí tu producto y recibilo cada 30 o 60 días. Pagás con Mercado Pago. Elaborado por Keating One S.R.L. Industria Argentina.">
  <meta name="theme-color" content="#0B0B0C">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Suscripción PROFIT®">
  <meta property="og:description" content="Elegí tu producto y recibilo cada 30 o 60 días. Pagás con Mercado Pago.">
  <meta property="og:image" content="public/packshots/web/creatina-monohidrato-300g-768.jpg">
  <link rel="icon" type="image/png" href="public/brand/profit-logo-negro.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="public/packshots/web/creatina-monohidrato-300g-768.jpg">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip" href="#suscripcion">Ir a la suscripción</a>

  <div class="topbar" data-slot="topbar"></div>

  <header class="header">
    <div class="wrap header__in">
      <a href="#" class="header__logo" aria-label="PROFIT, inicio">
        <img src="public/brand/profit-logo-blanco.png" alt="PROFIT" width="120" height="30">
      </a>
      <nav class="header__nav" aria-label="Secciones">
        <a href="#como-funciona">Cómo funciona</a>
        <a href="#suscripcion">Productos</a>
        <a href="#preguntas">Preguntas</a>
      </nav>
      <a href="#suscripcion" class="btn btn--small btn--light">Suscribirme</a>
    </div>
  </header>

  <main>
    <section class="hero" data-slot="hero" aria-label="Presentación"></section>
    <section class="section" id="empezar" data-slot="empezar" aria-labelledby="empezar-t"></section>
    <section class="section section--bone" id="suscripcion" data-slot="selector" aria-labelledby="selector-t"></section>
    <section class="section section--ink" id="como-funciona" data-slot="como" aria-labelledby="como-t"></section>
    <section class="section" id="cuando" data-slot="cuando" aria-labelledby="cuando-t"></section>
    <section class="section section--bone" id="ciclo" data-slot="ciclo" aria-labelledby="ciclo-t"></section>
    <section class="section" id="opiniones" data-slot="opiniones" aria-labelledby="opiniones-t" hidden></section>
    <section class="section section--ink" id="no-vas-a-leer" data-slot="noleer" aria-labelledby="noleer-t"></section>
    <section class="section" id="una-vez" data-slot="unavez" aria-labelledby="unavez-t"></section>
    <section class="section section--bone" id="preguntas" data-slot="faq" aria-labelledby="faq-t"></section>
    <section class="section" id="quiero-vender" data-slot="vender" aria-labelledby="vender-t"></section>
  </main>

  <footer class="footer" data-slot="footer"></footer>

  <div class="sticky" data-slot="sticky" hidden></div>
  <a class="wa-float" data-slot="wa-float" href="#" target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.1.7.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.2-.2-.4-.3Z"/></svg>
  </a>

  <noscript>
    <div class="wrap noscript">Para elegir tu suscripción necesitás tener JavaScript activado. También podés escribirnos por WhatsApp al +54 9 11 6027-7603.</div>
  </noscript>

  <script src="assets/app.js" defer></script>
</body>
</html>
